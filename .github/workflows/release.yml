name: Test, build, and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quicknotes-release
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model and UI tests
        run: |
          npm ci
          npm test
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: build/QuickNotes-*.png
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build app and native test APKs
        run: |
          ./build.sh
          ./tests/android/build.sh
      - name: Prepare signing handoff
        run: |
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: signing-handoff
          path: |
            build/aligned.apk
            build/apksigner.jar
      - name: Verify production packaging and prepare upgrade test
        if: contains(github.event.head_commit.message, '[release-signed]')
        run: |
          gzip -dc release/QuickNotes-v1.8.4.apk.gz > build/production.apk
          python3 scripts/check_apk_alignment.py build/production.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 build/production.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/production.apk
          curl -fL --retry 3 https://github.com/requiredtruth/quicknotes-ios-style/releases/download/v1.8.2/QuickNotes-v1.8.2.apk -o build/previous-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 alarm and deletion confirmation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install --no-incremental dist/QuickNotes-v1.8.4.apk
            adb install --no-incremental build/native-tests.apk
            adb shell pm grant com.quicknotes.app android.permission.POST_NOTIFICATIONS
            adb shell appops set com.quicknotes.app SCHEDULE_EXACT_ALARM allow
            adb shell appops set com.quicknotes.app USE_FULL_SCREEN_INTENT allow
            adb logcat -c
            adb shell am instrument -w com.quicknotes.app.tests/com.quicknotes.app.NativeTests | tee build/native-tests.txt
            adb logcat -d > build/native-logcat.txt
            adb shell dumpsys alarm > build/native-alarms.txt
            python3 -c "from pathlib import Path; assert 'Native alarm and confirmation tests passed' in Path('build/native-tests.txt').read_text()"
            set -e; if [ -f build/production.apk ]; then adb uninstall com.quicknotes.app.tests; adb uninstall com.quicknotes.app; adb install --no-incremental build/previous-release.apk; adb shell monkey -p com.quicknotes.app -c android.intent.category.LAUNCHER 1; adb install --no-incremental -r build/production.apk; adb shell monkey -p com.quicknotes.app -c android.intent.category.LAUNCHER 1; adb shell pidof com.quicknotes.app; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification
          path: build/native-*.txt
  release:
    needs: [native, ui]
    if: contains(github.event.head_commit.message, '[release-signed]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile source and verify APK
        run: |
          ./build.sh
          gzip -dk release/QuickNotes-v1.8.4.apk.gz
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/QuickNotes-v1.8.4.apk
          python3 tests/check_release.py
          python3 scripts/check_apk_alignment.py release/QuickNotes-v1.8.4.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 release/QuickNotes-v1.8.4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/QuickNotes-v1.8.4.apk | grep -q '4b76d05ec8ac6f20fd86b4e79b25e65f8b3be1dae1d02f5731c98d6c767fa843'
      - name: Prepare assets
        run: |
          cp release/QuickNotes-v1.8.4.apk dist/QuickNotes-v1.8.4.apk
          git archive --format=zip --prefix=QuickNotes/ HEAD -o dist/QuickNotes-source-v1.8.4.zip
          cp spec.md dist/spec.md
          cd dist
          sha256sum QuickNotes-v1.8.4.apk QuickNotes-source-v1.8.4.zip spec.md > SHA256SUMS
      - name: Publish release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.8.4 >/dev/null 2>&1; then
            gh release create v1.8.4 --target "$GITHUB_SHA" --title 'QuickNotes 1.8.4' --notes-file release-notes.md
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.8.4" -f sha="$GITHUB_SHA" -F force=true
          fi
          gh release upload v1.8.4 dist/QuickNotes-v1.8.4.apk dist/QuickNotes-source-v1.8.4.zip dist/spec.md dist/SHA256SUMS --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            build/QuickNotes-*.png
            dist/*
